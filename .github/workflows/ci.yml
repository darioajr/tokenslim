name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Tag used to stamp release metadata in each build checkout
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Stamp version from release tag
        if: inputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/set-release-version.py --tag "$RELEASE_TAG"
      - name: Isolate local state
        run: echo "TOKENSLIM_HOME=$RUNNER_TEMP/tokenslim-ci" >> "$GITHUB_ENV"
      - name: Verify dependencies and plugin metadata
        run: |
          go mod verify
          python3 scripts/validate-release.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Lint
        run: make lint
      - name: Tests and coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Scan Go vulnerabilities
        if: runner.os == 'Linux'
        run: make vulncheck
      - name: End-to-end scenarios for both adapters
        run: |
          make demo
          python3 scripts/check-hook-command.py
      - name: Add efficiency report to job summary
        if: always()
        run: |
          if test -f scenarios/results/report.md; then
            cat scenarios/results/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage and scenario reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: |
            coverage.out
            scenarios/results/
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Stamp version from release tag
        if: inputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/set-release-version.py --tag "$RELEASE_TAG"
      - name: Verify, test, and build
        shell: bash
        run: |
          go mod verify
          python scripts/validate-release.py
          python -m unittest discover -s scripts -p 'test_*.py'
          go vet ./...
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          python scripts/build.py
          python scenarios/run.py --check
          python scripts/check-hook-command.py
      - name: Upload coverage and scenario reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-windows-latest
          path: |
            coverage.out
            scenarios/results/
          if-no-files-found: warn
          retention-days: 14

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./internal/compressor -run '^$' -fuzz FuzzReducer -fuzztime 100000x -parallel 2 -timeout 3m
      - run: go test ./internal/hook -run '^$' -fuzz FuzzHook -fuzztime 100000x -parallel 2 -timeout 3m
      - name: Preserve failing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus
          path: internal/**/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make workflow-lint

  packages:
    name: Packages
    needs: [test, windows, fuzz, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Stamp version from release tag
        if: inputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/set-release-version.py --tag "$RELEASE_TAG"
      - name: Build and verify twelve plugin archives
        run: make release-check
      - name: Smoke test Linux release
        run: |
          version=$(cat VERSION)
          staging=$(mktemp -d)
          for agent in claude codex; do
            mkdir -p "$staging/$agent"
            tar -xzf "dist/tokenslim-$version-$agent-linux-amd64.tar.gz" -C "$staging/$agent"
            test "$("$staging/$agent/bin/tokenslim" version)" = "tokenslim $version"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  windows-packages:
    name: Windows package smoke test
    needs: packages
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: dist
      - name: Verify checksums and run Windows AMD64 packages
        shell: pwsh
        run: |
          foreach ($line in Get-Content dist/SHA256SUMS) {
            $digest, $name = $line -split '  ', 2
            if ((Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower() -ne $digest) {
              throw "Checksum mismatch: $name"
            }
          }
          foreach ($archive in Get-ChildItem dist/*-windows-amd64.zip) {
            $destination = Join-Path $env:RUNNER_TEMP $archive.BaseName
            Expand-Archive $archive.FullName $destination
            $version = (Get-Content "$destination/VERSION").Trim()
            $actual = & "$destination/bin/tokenslim.exe" version
            if ($LASTEXITCODE -ne 0 -or $actual -ne "tokenslim $version") {
              throw "Invalid binary: $archive"
            }
          }
